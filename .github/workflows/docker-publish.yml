name: Build Image

# Image dibangun di sini, bukan di VPS.
#
# Build Next.js butuh 1,5-2 GB RAM. VPS produksi hanya 2 GB dan sudah menjalankan
# Coolify beserta database internalnya, jadi build di sana membuat seluruh host
# kehabisan memori dan VPS berhenti merespons. Runner GitHub punya RAM jauh lebih
# besar, lalu Coolify hanya menarik image hasilnya.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Gatekeeper: jangan pernah push image yang tidak lolos tes.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit and contract tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Driver docker bawaan tidak mendukung cache export, jadi buildx perlu
      # builder sendiri (docker-container) supaya cache GHA benar-benar dipakai.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha-<commit> selalu ditulis supaya Coolify bisa menarik image
          # persis sesuai commit, bukan sekadar tag latest yang bergerak.
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* dibekukan nilainya ke dalam bundle JavaScript saat
          # `next build`, jadi keduanya harus ada sebagai ARG di tahap builder
          # (lihat Dockerfile). Tanpa ini, Sentry di browser tidak akan
          # pernah menyala di produksi meski DSN-nya sudah diisi di Coolify.
          #
          # Keduanya dibaca dari secrets, bukan dari env repository, supaya
          # fork dan pull request dari luar tidak bisa membaca nilainya.
          # Secret yang kosong tetap aman: ARG default-nya kosong dan kode
          # Sentry.init dilewati saat DSN kosong.
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }}
