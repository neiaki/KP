name: Build Image

# Image dibangun di sini, bukan di VPS.
#
# Build Next.js butuh 1,5-2 GB RAM. VPS produksi hanya 2 GB dan sudah menjalankan
# Coolify beserta database internalnya, jadi build di sana membuat seluruh host
# kehabisan memori dan VPS berhenti merespons. Runner GitHub punya RAM jauh lebih
# besar, lalu Coolify hanya menarik image hasilnya.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gatekeeper: jangan pernah push image yang tidak lolos tes.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit and contract tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha-<commit> selalu ditulis supaya Coolify bisa menarik image
          # persis sesuai commit, bukan sekadar tag latest yang bergerak.
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
