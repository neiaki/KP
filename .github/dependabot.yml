# Dependabot untuk At Cell.
#
# security.yml sudah menjalankan `npm audit --audit-level=high` setiap Senin
# dan memindai lockfile terhadap OSV. Yang belum ada sebelumnya adalah bagian
# yang membuka PR pembaruan: tanpa file ini, advisory baru hanya dilaporkan
# sebagai job yang gagal, dan tidak ada yang menghasilkan diff untuk ditinjau.
#
# Batas jumlah PR terbuka sengaja rendah (5 untuk npm). Dependabot membuka PR
# untuk setiap rantai langsung, dan tanpa batas itu satu update esbuild atau
# drizzle-kit bisa memakan seluruh antrean review.
version: 2

updates:
  # Single-source repo: hanya ada package.json di root, tidak ada workspace.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # Senin, 4 menit sebelum jadwal security.yml (03.37 UTC). PR week's
      # opened sedikit lebih dulu supaya lockfile yang kemudian dipindai
      # security.yml sudah memuat versi yang baru.
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      # Next.js, React, dan eslint-config-next harus naik bersamaan:
      # memisahkan mereka menghasilkan CI gagal karena peer dependency.
      next-ecosystem:
        patterns:
          - "next"
          - "eslint-config-next"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Toolchain styling dan ORM mendapat satu PR karena sama-sama sering
      # punya dependensi bersama.
      styling-and-orm:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/postcss"
          - "drizzle-orm"
          - "drizzle-kit"
      # Sisanya satu per satu, bukan satu grup.
      #
      # Versi pertama memakai pola "*" untuk semua devDependency, dan
      # hasilnya satu PR yang menaikkan typescript 5 ke 7 dan eslint 9 ke 10
      # sekaligus. Keduanya lompatan mayor, dan keduanya gagal bersama:
      # typescript-eslint yang dipakai eslint-config-next belum mendukung
      # TS 7, jadi lint mati sebelum sempat memeriksa apa pun.
      #
      # typescript dan eslint tidak bisa dinaikkan bersama, dan tidak bisa
      # dinaikkan satu per satu lewat bot pun: yang salah urutan akan
      # menggagalkan build, dan yang benar urutan butuh perubahan manual pada
      # file konfigurasi eslint. Keduanya diabaikan di sini supaya
      # lompatan mayor terjadi sebagai keputusan sadar, bukan efek samping
      # jadwal mingguan.
      #
      # Sisanya (@types/node, drizzle-kit, dan seterusnya) tetap dipantau,
      # satu per satu. PR kecil lebih mudah ditinjau daripada satu PR berisi
      # lima perubahan yang harus diuji sebagai satu kesatuan.
      dev-types:
        dependency-type: development
        patterns:
          - "@types/*"
      dev-build:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          #/type definitions, sudah punya kelompok sendiri
          - "@types/*"
          # Lompatan mayor, lihat penjelasan di atas
          - "typescript"
          - "eslint"

  # GitHub Actions. Workflow di repo memakai tag mayor (@v4), yang bisa naik
  # ke versi mayor baru tanpa ada commit di repo.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
