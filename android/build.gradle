// Build file root. File ini hanya menjaga versi plugin Android dan Gradle
// supaya build di mesin mana pun menghasilkan APK dengan toolchain yang sama.
//
// Repository tidak dideklarasikan di sini. Gradle hanya mengizinkan
// pluginManagement {}, buildscript {}, dan plugins {} sebelum blok plugins,
// jadi blok repositories di file ini akan menggagalkan build dengan pesan
// yang tidak menyebut file mana yang bermasalah. Repository dikelola di
// settings.gradle lewat dependencyResolutionManagement, yang berlaku untuk
// semua modul sekaligus.
plugins {
    id 'com.android.application' version '8.9.1' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
