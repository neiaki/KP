<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" fill="none">
  <!-- Logo penuh At Cell untuk keperluan di luar aplikasi (dokumen, sosmed).
       Teks memakai stack sistem karena SVG di <img> tidak bisa memuat font
       eksternal; bentuk glyph sama dengan logo-icon.svg. Warna flat aksen
       dan ink saja, tanpa gradient. -->
  <style>
    .title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -0.02em; }
    .sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 600; font-size: 13px; fill: #475467; }
    .at { fill: #0B4ED8; }
    .cell { fill: #101828; }
  </style>
  <g transform="translate(12, 12) scale(0.1696)">
    <rect x="32" y="32" width="448" height="448" rx="112" fill="#0B4ED8"/>
    <path d="M 172 108 A 116 116 0 0 1 340 108" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 204 140 A 72 72 0 0 1 308 140" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.55"/>
    <path d="M 148 392 L 256 182 L 364 392" stroke="#ffffff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 194 304 L 318 304" stroke="#ffffff" stroke-width="36" stroke-linecap="round" fill="none"/>
    <circle cx="256" cy="182" r="16" fill="#ffffff"/>
  </g>
  <text x="106" y="44" dominant-baseline="central" class="title">
    <tspan class="at">At </tspan><tspan class="cell">Cell</tspan>
  </text>
  <text x="107" y="72" dominant-baseline="central" class="sub">
    Koneksi &amp; Ponsel Andal • Serpong
  </text>
</svg>
